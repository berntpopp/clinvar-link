name: Data bundle

on:
  schedule:
    - cron: "37 5 * * 5"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.existing.outputs.tag || steps.meta.outputs.tag }}
      state: ${{ steps.existing.outputs.state || steps.release-state.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.7"
          enable-cache: false
      - run: uv sync --frozen
      # Rebuilds are not byte-identical (the DB stamps source_retrieved_at), so an
      # unchanged upstream is detected from Last-Modified before building, then verified.
      - name: Skip when this upstream release is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz
        run: |
          set -euo pipefail
          last_modified="$(curl -fsSI "$SOURCE_URL" | tr -d '\r' \
            | sed -n 's/^[Ll]ast-[Mm]odified: //p')"
          [[ -n "$last_modified" ]] || exit 0
          tag="$(uv run python -c 'import sys
          from clinvar_link.ingest.bundle import release_tag_for_date
          print(release_tag_for_date(sys.argv[1]))' "$last_modified")"
          [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft \
            --jq .isDraft 2>/dev/null)" == false ]] || exit 0
          mkdir -p /tmp/published
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/published
          [[ "$(jq -r .source_last_modified /tmp/published/bundle-metadata.json)" == "$last_modified" ]] \
            || exit 0
          ./scripts/verify_release_assets.sh "$tag" /tmp/published "$GITHUB_REPOSITORY"
          echo "Upstream $last_modified is already published and verified as $tag."
          { echo "tag=$tag"; echo "state=published_noop"; } >> "$GITHUB_OUTPUT"
      - name: Build and pack without credentials
        if: steps.existing.outputs.state != 'published_noop'
        env:
          CLINVAR_LINK_DATA_DIR: data
        run: |
          set -euo pipefail
          uv run clinvar-link-data build
          uv run clinvar-link-data pack --out-dir dist
      - name: Create exact release metadata
        id: meta
        if: steps.existing.outputs.state != 'published_noop'
        run: |
          set -euo pipefail
          tag="$(uv run python -m clinvar_link.ingest.release_metadata build \
            --db-path data/clinvar.sqlite --asset-path dist/clinvar.sqlite.zst --out-dir dist)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # Decide before the data-release gate so an existing bundle never asks for approval.
      # A read-only token cannot see drafts; they read as `create` and re-resolve in publish.
      - name: Select immutable release state
        id: release-state
        if: steps.existing.outputs.state != 'published_noop'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: ./scripts/select_release_state.sh
      - if: steps.existing.outputs.state != 'published_noop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clinvar-data-${{ steps.meta.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.state == 'create' || needs.build.outputs.state == 'draft_publish_existing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: data-release
    concurrency:
      group: clinvar-data-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.7"
          enable-cache: false
      - run: uv sync --frozen
      # A run approved after a newer bundle shipped is obsolete (and its artifact may have
      # expired): no-op instead of publishing an older bundle. Tags are bundle-YYYY-MM-DD.
      - name: Skip when a newer bundle is already published
        id: supersede
        run: |
          set -euo pipefail
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(startswith("bundle-"))] | max // ""')"
          if [[ "$latest" > "$TAG" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG superseded by published $latest; nothing to publish."
          fi
      - if: steps.supersede.outputs.superseded != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clinvar-data-${{ needs.build.outputs.tag }}
          path: dist
      - name: Verify transferred bytes
        if: steps.supersede.outputs.superseded != 'true'
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Re-check immutable release state behind the gate
        id: release-state
        if: steps.supersede.outputs.superseded != 'true'
        run: ./scripts/select_release_state.sh
      - name: Create empty immutable draft
        if: steps.release-state.outputs.state == 'create'
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true --title "$TAG" --notes "Immutable ClinVar reference bundle; research use only."
      - name: Upload without replacement
        if: steps.release-state.outputs.state == 'create'
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Attest exact release assets
        if: steps.release-state.outputs.state == 'create'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish once and verify immutable assets
        if: steps.release-state.outputs.state == 'create' || steps.release-state.outputs.state == 'draft_publish_existing'
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          if [[ "${{ steps.release-state.outputs.state }}" == draft_publish_existing ]]; then
            ./scripts/verify_release_assets.sh "$TAG" "/tmp/existing" "$GITHUB_REPOSITORY"
          else
            ./scripts/verify_release_assets.sh "$TAG" "dist" "$GITHUB_REPOSITORY"
          fi
