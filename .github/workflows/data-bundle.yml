name: Data bundle

on:
  schedule:
    - cron: "37 5 * * 5"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.7"
          enable-cache: false
      - run: uv sync --frozen
      - name: Build and pack without credentials
        env:
          CLINVAR_LINK_DATA_DIR: data
        run: |
          set -euo pipefail
          uv run clinvar-link-data build
          uv run clinvar-link-data pack --out-dir dist
      - name: Create exact release metadata
        id: meta
        run: |
          set -euo pipefail
          tag="$(uv run python -m clinvar_link.ingest.release_metadata build \
            --db-path data/clinvar.sqlite --asset-path dist/clinvar.sqlite.zst --out-dir dist)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clinvar-data-${{ steps.meta.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: data-release
    concurrency:
      group: clinvar-data-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.7"
          enable-cache: false
      - run: uv sync --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clinvar-data-${{ needs.build.outputs.tag }}
          path: dist
      - name: Verify transferred bytes
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Select immutable release state
        id: release-state
        run: |
          set -euo pipefail
          state=create
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/release.json; then
            mkdir -p /tmp/existing
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/existing
            expected_assets='SHA256SUMS
          bundle-metadata.json
          clinvar.sqlite.zst
          clinvar.sqlite.zst.sha256'
            actual_assets="$(find /tmp/existing -maxdepth 1 -type f -printf '%f\n' | sort)"
            test "$actual_assets" = "$expected_assets" || {
              echo "release $TAG has missing, corrupt, or extra assets" >&2
              exit 1
            }
            (cd /tmp/existing && sha256sum --check SHA256SUMS)
            state="$(uv run python -m clinvar_link.ingest.release_metadata state \
              --current dist/bundle-metadata.json --existing /tmp/existing/bundle-metadata.json \
              $(test "$(jq -r .isDraft /tmp/release.json)" = true && echo --draft))"
            case "$state" in
              published_noop|draft_publish_existing) gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" ;;
              collision) echo "immutable release collision: $TAG" >&2; exit 1 ;;
              *) echo "unexpected release state: $state" >&2; exit 1 ;;
            esac
          else
            response=/tmp/release-view.txt
            if gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$response" 2>&1; then
              echo "release lookup disagrees with gh release view" >&2
              exit 1
            fi
            grep -Eq '^HTTP/[0-9.]+ 404' "$response" || { cat "$response" >&2; exit 1; }
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Create empty immutable draft
        if: steps.release-state.outputs.state == 'create'
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true --title "$TAG" --notes "Immutable ClinVar reference bundle; research use only."
      - name: Upload without replacement
        if: steps.release-state.outputs.state == 'create'
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Attest exact release assets
        if: steps.release-state.outputs.state == 'create'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish once and verify immutable assets
        if: steps.release-state.outputs.state == 'create' || steps.release-state.outputs.state == 'draft_publish_existing'
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"
          while read -r _ asset; do gh release verify-asset "$TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"; done < dist/SHA256SUMS
