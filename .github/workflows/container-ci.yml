name: Container CI

on:
  pull_request:
    paths:
      - clinvar_link/**
      - docker/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - vendor/genefoundry/**
      - .github/workflows/container-ci.yml
      - .github/workflows/container-release.yml
      - .github/workflows/data-bundle.yml
  push:
    branches:
      - main
    paths:
      - clinvar_link/**
      - docker/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - vendor/genefoundry/**
      - .github/workflows/container-ci.yml
      - .github/workflows/container-release.yml
      - .github/workflows/data-bundle.yml

concurrency:
  group: container-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-ci:
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@3d3cc20477828ddbd8a0c980b5b4f709e2612c02 # genefoundry-router v0.8.6
